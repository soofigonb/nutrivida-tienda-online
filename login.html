<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nutrivida</title>}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div style="width: 100%; max-width: 500px;">

            <div class="text-center mb-4">
                <h2 class="text-muted">Iniciar sesión</h2>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" placeholder="Contraseña" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="Recordarme">
                                <label class="form-check-label" for="Recordarme">Recordarme</label>
                            </div>
                            <a href="#" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
                        </div>
                        <button type="submit" class="btn btn-info text-white w-100">Iniciar sesión</button>
                    </form>
                    <div class="text-center mt-4">
                        <small class="text-muted">¿No tienes una cuenta? <a href="registro.html" class="text-decoration-none">Regístrate aquí</a></small>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="admin-home.html" class="btn btn-outline-secondary btn-sm">Acceder como administrador</a>
            </div>
        </div>
    </div>

</body>

</html>
