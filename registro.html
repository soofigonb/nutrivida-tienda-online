<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro paciente - Nutrivida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container my-4">
        <!-- Encabezado centrado al ancho del formulario -->
        <div class="mx-auto" style="max-width: 900px;">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h2 class="m-0" style="color: #2c3e6e;">Nuevo paciente</h2>
                <a href="admin-pacientes.html" class="btn btn-outline-secondary btn-sm">Volver a la lista</a>
            </div>
        </div>

        <!-- Tarjeta Principal Centrada -->
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 900px;">
            <div class="card-body p-4">
                <div class="row align-items-center">

                    <!-- Columna Izquierda: Imagen -->
                    <div class="col-md-4 text-center mb-3 mb-md-0">
                        <img src="img/registro1.jpg" alt="Registro" class="img-fluid rounded"
                            style="width: 100%; max-height: 400px; object-fit: cover;">
                    </div>

                    <!-- Columna Derecha: Formulario -->
                    <div class="col-md-8">
                        <form id="formPaciente" class="needs-validation" novalidate>
                            <div class="row g-2">
                                <div class="col-6 mb-1">
                                    <label class="form-label small mb-1">Nombre</label>
                                    <input type="text" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-6 mb-1">
                                    <label class="form-label small mb-1">Apellidos</label>
                                    <input type="text" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-12 mb-1">
                                    <label class="form-label small mb-1">Correo electrónico</label>
                                    <input type="email" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-12 mb-1">
                                    <label class="form-label small mb-1">Teléfono</label>
                                    <input type="tel" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-6 mb-1">
                                    <label class="form-label small mb-1">Contraseña</label>
                                    <input type="password" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-6 mb-1">
                                    <label class="form-label small mb-1">Confirmar contraseña</label>
                                    <input type="password" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label small mb-1">Región</label>
                                    <select class="form-select form-select-sm" required>
                                        <option value="">Seleccione región</option>
                                        <option value="region1">Región de los Ríos</option>
                                        <option value="region2">Región de los Lagos</option>
                                        <option value="region3">Región de la Araucanía</option>
                                    </select>
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label small mb-1">Comuna</label>
                                    <select class="form-select form-select-sm" required>
                                        <option value="">Seleccione comuna</option>
                                        <option value="comuna1">Valdivia</option>
                                        <option value="comuna2">Puerto Montt</option>
                                        <option value="comuna3">Temuco</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-3">
                                    <button type="submit" class="btn btn-info text-white w-100">Registrar paciente</button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
