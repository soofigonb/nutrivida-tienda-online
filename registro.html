<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registro paciente - Nutrivida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="http://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">
                <a href="admin-home.html">NutriVida</a>
            </div>
            <nav class="admin-nav">
                <a href="admin-home.html" class="admin-nav-link">
                    <i class="bi bi-house"></i> Dashboard
                </a>
                <a href="admin-pacientes.html" class="admin-nav-link active">
                    <i class="bi bi-people"></i> Pacientes
                </a>
                <a href="admin-nutricionistas.html" class="admin-nav-link">
                    <i class="bi bi-person-badge"></i> Nutricionistas
                </a>
            </nav>
        </aside>
        <main class="admin-main">
            <div class="admin-content p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <h2 class="m-0" style="color: #2c3e6e;">Nuevo paciente</h2>
                    <a href="admin-pacientes.html" class="btn btn-outline-secondary btn-sn">Volver a la lista</a>
                </div>
                <div class="card shadow-sm border-0" style="max-width: 700px;">
                    <div class="card-body p-4">
                        <form id="formPaciente">

                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Apellidos</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Región</label>
                                <select class="form-select" required>
                                    <option value="">Seleccione región</option>
                                    <option value="region1">Región de los Ríos</option>
                                    <option value="region2">Región de los Lagos</option>
                                    <option value="region3">Región de la Araucanía</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Comuna</label>
                                <select class="form-select" required>
                                    <option value="">Seleccione comuna</option>
                                    <option value="comuna1">Valdivia</option>
                                    <option value="comuna2">Puerto Montt</option>
                                    <option value="comuna3">Temuco</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-info text-white">Registrar paciente</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

</body>

</html>
