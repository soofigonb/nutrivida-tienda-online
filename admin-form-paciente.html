<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NutriVida - Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Cormorant:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oleo+Script:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">
                <a href="admin-home.html">NutriVida</a>
            </div>

            <nav class="admin-nav">
                <a href="admin-home.html" class="admin-nav-link">
                    <i class="bi bi-house"></i> Dashboard
                </a>
                <a href="admin-pacientes.html" class="admin-nav-link active">
                    <i class="bi bi-people"></i> Pacientes
                </a>
                <a href="admin-nutricionistas.html" class="admin-nav-link">
                    <i class="bi bi-person-badge"></i> Nutricionistas
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <div class="admin-user">
                    <i class="bi bi-person-circle"></i>
                    <span>Administrador</span>
                </div>
                <a href="index.html" class="admin-nav-link">
                    <i class="bi bi-box-arrow-left"></i> Volver al sitio
                </a>
            </div>
        </aside>

        <main class="admin-content">

            <header class="admin-topbar admin-topbar-listado">

                <div>
                    <p class="admin-bienvenida">Gestión de pacientes</p>

                    <h1 id="titulo-form-paciente">
                        Nuevo paciente
                    </h1>

                    <p class="admin-descripcion">
                        Completa los datos personales y de contacto del paciente.
                    </p>
                </div>

                <a href="admin-pacientes.html" class="admin-btn-volver">

                    <i class="bi bi-arrow-left"></i>
                    Volver al listado
                </a>

            </header>

            <section class="admin-panel">

                <div class="admin-form-contenedor">

                    <div class="admin-form-encabezado">

                        <div class="admin-form-icono">
                            <i class="bi bi-person-plus"></i>
                        </div>

                        <div>
                            <h2>Información del paciente</h2>

                            <p>
                                Los campos señalados son obligatorios.
                            </p>
                        </div>

                    </div>

                    <form id="form-paciente" class="admin-form-card" novalidate>

                        <div class="row g-4">

                            <!-- Nombre -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-nombre" class="form-label">
                                    Nombre
                                </label>

                                <input type="text" id="paciente-nombre" class="form-control" minlength="2"
                                    maxlength="50" autocomplete="given-name" required>

                                <small class="form-text" id="error-paciente-nombre">
                                </small>

                            </div>

                            <!-- Apellidos -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-apellidos" class="form-label">
                                    Apellidos
                                </label>

                                <input type="text" id="paciente-apellidos" class="form-control" minlength="2"
                                    maxlength="100" autocomplete="family-name"
                                    aria-describedby="error-paciente-apellidos" required>

                                <small class="form-text" id="error-paciente-apellidos">
                                </small>

                            </div>

                            <!-- RUN -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-run" class="form-label">
                                    RUN
                                </label>

                                <input type="text" id="run-registro" name="run" class="form-control"
                                    placeholder="Ej: 18.345.678-5" minlength="11" maxlength="12" autocomplete="off"
                                    aria-describedby="error-run-registro" required>
                                <small class="form-text" id="error-paciente-run">
                                </small>

                            </div>

                            <!-- Correo -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-correo" class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email" id="paciente-correo" class="form-control"
                                    placeholder="nombre@correo.cl" autocomplete="email" required>

                                <small class="form-text" id="error-paciente-correo">
                                </small>

                            </div>

                            <!-- Fecha de nacimiento -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-fecha-nacimiento" class="form-label">
                                    Fecha de nacimiento
                                </label>

                                <input type="date" id="paciente-fecha-nacimiento" class="form-control"
                                    autocomplete="bday">

                                <small class="form-text" id="error-paciente-fecha-nacimiento">
                                </small>

                            </div>

                            <!-- Región -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-region" class="form-label">
                                    Región
                                </label>

                                <select id="paciente-region" class="form-select" required>

                                    <option value="">Seleccione una región</option>
                                    <option value="Valparaíso">Valparaíso</option>
                                    <option value="Metropolitana">Metropolitana</option>
                                    <option value="La Araucanía">La Araucanía</option>
                                </select>

                                <small class="form-text" id="error-paciente-region">
                                </small>

                            </div>

                            <!-- Comuna -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-comuna" class="form-label">
                                    Comuna
                                </label>

                                <select id="paciente-comuna" class="form-select" disabled required>

                                    <option value="">Seleccione una comuna</option>
                                </select>

                                <small class="form-text" id="error-paciente-comuna">
                                </small>

                            </div>

                            <!-- Dirección -->
                            <div class="col-12 col-md-6">

                                <label for="paciente-direccion" class="form-label">
                                    Dirección
                                </label>

                                <input type="text" id="paciente-direccion" class="form-control" maxlength="300"
                                    autocomplete="street-address" aria-describedby="error-paciente-direccion" required>

                                <small class="form-text" id="error-paciente-direccion">
                                </small>

                            </div>

                        </div>

                        <div class="admin-form-acciones">

                            <a href="admin-pacientes.html" class="admin-btn-cancelar">
                                Cancelar
                            </a>

                            <button type="submit" class="admin-btn-guardar">

                                <i class="bi bi-check-lg"></i>
                                Guardar paciente
                            </button>

                        </div>

                        <div id="mensaje-form-paciente" class="admin-form-mensaje" role="alert" aria-live="polite">
                        </div>

                    </form>

                </div>

            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/app.js" defer></script>
</body>

</html>
