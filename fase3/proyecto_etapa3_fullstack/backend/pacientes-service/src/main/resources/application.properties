# Nombre y puerto del microservicio
spring.application.name=pacientes-service
server.port=8082

# ------------------------------------------------------------------
# LOGS
# ------------------------------------------------------------------

logging.level.org.springframework.web=INFO
logging.level.root=INFO
spring.output.ansi.enabled=ALWAYS

# ------------------------------------------------------------------
# CONEXIÓN CON POSTGRESQL (SUPABASE)
# ------------------------------------------------------------------

# Variables exclusivas de la base de datos de pacientes
# La URL JDBC debe incluir sslmode=require
spring.datasource.url=${PACIENTES_DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${PACIENTES_DB_USERNAME:postgres.nyaxmfgatgsrspxdfxwf}
spring.datasource.password=${PACIENTES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ------------------------------------------------------------------
# INICIALIZACIÓN SQL
# ------------------------------------------------------------------

# Flyway administrará la estructura y los datos iniciales
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ------------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------------

# Valida las tablas sin crearlas ni modificarlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=db_pacientes

# Configuración de consultas y fechas
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# MIGRACIONES CON FLYWAY
# ------------------------------------------------------------------

spring.flyway.enabled=true
spring.flyway.default-schema=db_pacientes
spring.flyway.schemas=db_pacientes
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# ------------------------------------------------------------------
# SWAGGER / OPENAPI
# ------------------------------------------------------------------

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ------------------------------------------------------------------
# SEGURIDAD JWT (RESOURCE SERVER)
# ------------------------------------------------------------------

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.roles-claim=${JWT_ROLES_CLAIM:roles}
