# Nombre que identifica este componente de NutriVida.
spring.application.name=pacientes-service

# Puerto local del servicio. Su URL base es http://localhost:8082.
server.port=8082

# Registra solicitudes HTTP y actividad de los controladores.
logging.level.org.springframework.web=INFO

# Define el nivel general de mensajes en la consola.
logging.level.root=INFO

# Habilita colores en la consola.
spring.output.ansi.enabled=ALWAYS

# URL JDBC de PostgreSQL. Configura aquí el destino de Supabase mediante el entorno.
spring.datasource.url=${PACIENTES_DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}

# Usuario de PostgreSQL leído desde el entorno.
spring.datasource.username=${PACIENTES_DB_USERNAME:postgres.nyaxmfgatgsrspxdfxwf}

# Contraseña de PostgreSQL leída desde el entorno.
spring.datasource.password=${PACIENTES_DB_PASSWORD}

# Driver JDBC de PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Número máximo de conexiones simultáneas.
spring.datasource.hikari.maximum-pool-size=5

# Conexiones disponibles cuando el servicio está inactivo.
spring.datasource.hikari.minimum-idle=1

# Flyway se encarga de los scripts SQL al arrancar.
spring.sql.init.mode=never

# Define el orden de inicialización de JPA y SQL.
spring.jpa.defer-datasource-initialization=false

# Hibernate verifica que las tablas coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate

# Esquema de PostgreSQL usado por JPA.
spring.jpa.properties.hibernate.default_schema=db_pacientes

# Da formato a las consultas SQL registradas.
spring.jpa.properties.hibernate.format_sql=true

# Controla si Hibernate imprime las consultas SQL.
spring.jpa.show-sql=false

# Limita el acceso a datos a la capa de persistencia.
spring.jpa.open-in-view=false

# Zona horaria usada por JDBC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Habilita las migraciones versionadas.
spring.flyway.enabled=true

# Esquema donde Flyway registra el historial.
spring.flyway.default-schema=db_pacientes

# Esquemas administrados por Flyway.
spring.flyway.schemas=db_pacientes

# Crea el esquema cuando todavía no existe.
spring.flyway.create-schemas=true

# Ruta de los archivos SQL versionados.
spring.flyway.locations=classpath:db/migration

# Permite establecer la línea base de un esquema existente.
spring.flyway.baseline-on-migrate=true

# Protege el esquema contra el comando clean de Flyway.
spring.flyway.clean-disabled=true

# Publica el contrato OpenAPI.
springdoc.api-docs.enabled=true

# Habilita la interfaz Swagger.
springdoc.swagger-ui.enabled=true

# Ruta para probar la API en Swagger.
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Emisor que debe coincidir con el de Autenticación.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://localhost:8081}

# Dirección de las claves públicas para verificar JWT.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

# Campo del JWT que contiene los roles de la cuenta.
app.security.roles-claim=${JWT_ROLES_CLAIM:roles}
