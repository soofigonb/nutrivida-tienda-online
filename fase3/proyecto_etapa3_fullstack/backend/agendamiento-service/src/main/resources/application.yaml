# Configuración de agendamiento de NutriVida. La sangría agrupa cada propiedad.
# Las credenciales reales se configuran mediante variables de entorno.

# El nombre del servicio y su puerto están en application.properties.

# Opciones que Spring Boot utiliza al iniciar la aplicación.
spring:
  # Formato de los mensajes que aparecen en la terminal.
  output:
    # Opciones para colores mediante códigos ANSI.
    ansi:
      # Solicita colores incluso si la detección automática no los activa.
      enabled: ALWAYS

  # Conexión a la base PostgreSQL de agendamiento en Supabase.
  datasource:
    # Conexión Supabase con SSL; la variable permite usar otra base.
    url: ${AGENDAMIENTO_DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
    # Usuario del proyecto de agendamiento; puede reemplazarse desde el entorno.
    username: ${AGENDAMIENTO_DB_USERNAME:postgres.nyaxmfgatgsrspxdfxwf}
    # Contraseña desde el entorno; nunca escribir el secreto en este archivo.
    password: ${AGENDAMIENTO_DB_PASSWORD}
    # Driver JDBC que permite comunicarse con PostgreSQL.
    driver-class-name: org.postgresql.Driver
    # Pool que reutiliza conexiones para no abrir una por cada operación.
    hikari:
      # Permite como máximo cinco conexiones simultáneas.
      maximum-pool-size: 5
      # Mantiene una conexión ociosa preparada cuando es posible.
      minimum-idle: 1

  # Opciones de inicialización mediante scripts SQL convencionales.
  sql:
    # Configura la ejecución automática de schema.sql y data.sql.
    init:
      # No ejecuta esos scripts: las tablas se administran con Flyway.
      mode: never

  # Persistencia: relaciona las entidades Java con sus tablas PostgreSQL.
  jpa:
    # No posterga la inicialización de datos hasta después de JPA.
    defer-datasource-initialization: false
    # Opciones del motor Hibernate utilizado por JPA.
    hibernate:
      # Solo valida las tablas; no crea, modifica ni elimina su estructura.
      ddl-auto: validate
    # Propiedades adicionales que se entregan directamente a Hibernate.
    properties:
      # Agrupa las opciones específicas de este motor de persistencia.
      hibernate:
        # Esquema donde están las tablas de agendamiento dentro de la base.
        default_schema: db_agendamiento
        # Da formato al SQL cuando se habilita su visualización.
        format_sql: true
        # Opciones del intercambio de datos mediante JDBC.
        jdbc:
          # Usa UTC para el intercambio de fechas con la base.
          time_zone: UTC
    # No imprime automáticamente todas las consultas SQL en consola.
    show-sql: false
    # Obliga a leer las relaciones LAZY dentro de la transacción del servicio.
    open-in-view: false

  # Administración versionada de la estructura de la base de datos.
  flyway:
    # Aplica las migraciones pendientes durante el arranque.
    enabled: true
    # Esquema donde se conserva el historial de migraciones.
    default-schema: db_agendamiento
    # Esquema administrado por este servicio, separado de los demás.
    schemas: db_agendamiento
    # Permite crear el esquema si no existe y el usuario tiene permisos.
    create-schemas: true
    # Carpeta de recursos donde se buscan las migraciones SQL versionadas.
    locations: classpath:db/migration
    # Impide utilizar clean para borrar los objetos del esquema.
    clean-disabled: true

# Nivel de detalle de los eventos que se muestran en consola.
logging:
  # Cada entrada establece el nivel para todo el proceso o para un paquete.
  level:
    # Muestra los eventos generales habituales con nivel INFO.
    root: INFO
    # Muestra información de la capa web sin activar depuración detallada.
    org.springframework.web: INFO

# Documentación de los endpoints del servicio de agendamiento.
springdoc:
  # Documento OpenAPI JSON disponible por defecto en /v3/api-docs.
  api-docs:
    # Habilita la generación del documento de la API.
    enabled: true
  # Interfaz web para consultar y probar los endpoints.
  swagger-ui:
    # Habilita Swagger UI para probar las operaciones CRUD.
    enabled: true
    # Dirección de entrada: http://localhost:8085/doc/swagger-ui.html.
    path: /doc/swagger-ui.html
