# Nombre de la aplicación o microservicio
# Permite identificar este servicio dentro de NutriVida
# Nombre con que Spring identifica este componente en la configuración y en los logs.
spring.application.name=autenticacion-service

# Puerto donde se ejecutará este microservicio
# Dirección local: http://localhost:8081
# Puerto HTTP donde escucha el servicio.
server.port=8081

# ------------------------------------------------------------------
# LOGS
# ------------------------------------------------------------------

# Información de las solicitudes HTTP y los controladores
# Muestra mensajes informativos de la capa web.
logging.level.org.springframework.web=INFO

# Nivel general de los mensajes de la aplicación
# Nivel general de logs del proceso.
logging.level.root=INFO

# Activa colores en la consola
# Activa los códigos de color de Spring en una terminal que los soporte.
spring.output.ansi.enabled=ALWAYS

# ------------------------------------------------------------------
# CONEXIÓN CON POSTGRESQL EN SUPABASE
# ------------------------------------------------------------------

# Dirección de conexión obtenida desde una variable de entorno
# DB_URL debe incluir sslmode=require para utilizar una conexión cifrada
# Lee la URL JDBC de la base exclusiva de este servicio desde el entorno.
spring.datasource.url=${AUTENTICACION_DB_URL}

# Usuario y contraseña definidos mediante variables de entorno
# Lee el usuario PostgreSQL desde el entorno para no fijar credenciales en este archivo.
spring.datasource.username=${AUTENTICACION_DB_USERNAME}
# Lee la contraseña PostgreSQL desde el entorno.
spring.datasource.password=${AUTENTICACION_DB_PASSWORD}

# Driver de conexión con PostgreSQL
# Selecciona el driver JDBC de PostgreSQL para establecer la conexión con la base.
spring.datasource.driver-class-name=org.postgresql.Driver

# Máximo de conexiones simultáneas del servicio
# Limita el pool a cinco conexiones simultáneas para evitar consumir conexiones innecesarias.
spring.datasource.hikari.maximum-pool-size=5

# Cantidad mínima de conexiones disponibles
# Mantiene como mínimo una conexión ociosa preparada para atender solicitudes.
spring.datasource.hikari.minimum-idle=1

# ------------------------------------------------------------------
# INICIALIZACIÓN SQL
# ------------------------------------------------------------------

# Desactiva la ejecución automática de schema.sql y data.sql
# La estructura y los datos iniciales se administrarán con Flyway
# Desactiva schema.sql y data.sql automáticos.
spring.sql.init.mode=never

# Flyway ejecutará las migraciones antes de inicializar JPA
# No posterga la inicialización de la fuente de datos hasta después de JPA.
spring.jpa.defer-datasource-initialization=false

# ------------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------------

# Hibernate valida las tablas, pero no las crea ni modifica
# validate comprueba que las tablas coincidan con las entidades, sin crearlas, modificarlas ni borrarlas.
spring.jpa.hibernate.ddl-auto=validate

# Esquema utilizado por las entidades del servicio
# Esquema SQL predeterminado para las entidades de este servicio, dentro de su propia base PostgreSQL.
spring.jpa.properties.hibernate.default_schema=db_autenticacion

# Formatea el SQL cuando se habilita su visualización
# Da formato al SQL si se habilita su salida.
spring.jpa.properties.hibernate.format_sql=true

# Evita imprimir consultas SQL directamente en consola
# Evita que Hibernate imprima directamente cada consulta SQL en la consola.
spring.jpa.show-sql=false

# Evita mantener abierta la sesión JPA durante toda la petición web
# Cierra el contexto de persistencia al salir de la capa de negocio.
spring.jpa.open-in-view=false

# Utiliza UTC para el intercambio de fechas con la base de datos
# Usa UTC al intercambiar fechas con JDBC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# MIGRACIONES CON FLYWAY
# ------------------------------------------------------------------

# Activa las migraciones
# Activa Flyway para aplicar migraciones de estructura pendientes al iniciar el servicio.
spring.flyway.enabled=true

# Esquema predeterminado de Flyway
# Establece el esquema donde Flyway administra el historial de migraciones de este servicio.
spring.flyway.default-schema=db_autenticacion

# Esquemas administrados por este servicio
# Enumera los esquemas que administra esta instancia de Flyway.
spring.flyway.schemas=db_autenticacion

# Permite crear el esquema si todavía no existe
# Permite crear el esquema configurado si aún no existe y el usuario PostgreSQL tiene permiso.
spring.flyway.create-schemas=true

# Ubicación de los archivos SQL de migración
# Busca los archivos SQL versionados dentro de src/main/resources/db/migration.
spring.flyway.locations=classpath:db/migration

# Deshabilita la operación clean para evitar el borrado del esquema
# Deshabilita la operación clean que borraría objetos del esquema.
spring.flyway.clean-disabled=true

# ------------------------------------------------------------------
# SWAGGER / OPENAPI
# ------------------------------------------------------------------

# Habilita la documentación de la API
# Habilita el documento OpenAPI JSON, disponible por defecto en /v3/api-docs.
springdoc.api-docs.enabled=true

# Habilita la interfaz de Swagger
# Habilita la interfaz web de Swagger para consultar y probar la API.
springdoc.swagger-ui.enabled=true

# Dirección de Swagger UI
# Define la dirección de entrada a Swagger UI en este servicio.
springdoc.swagger-ui.path=/doc/swagger-ui.html