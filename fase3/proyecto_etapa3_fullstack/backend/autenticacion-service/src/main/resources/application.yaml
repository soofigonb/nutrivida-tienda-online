# Configuración propia de la autenticación de NutriVida
# que implementaremos en los siguientes pasos.

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    # Correo nuevo proporcionado por el operador.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  registration:
    # Debe existir en rol; solo el operador puede cambiarlo.
    default-role: ${REGISTRATION_DEFAULT_ROLE:CLIENTE}
    # Debe existir en estado_usuario.
    default-state: ${REGISTRATION_DEFAULT_STATE:ACTIVO}
  jwt:
    # Identifica al servicio que emite los tokens
    issuer: ${JWT_ISSUER:http://localhost:8081}

    # Tiempo de validez del token de acceso: 15 minutos
    # Duración configurable del JWT; m significa minutos.
    access-token-duration: ${JWT_ACCESS_TOKEN_DURATION:15m}

    # Tiempo de validez del token de renovación: 7 días
    refresh-token-duration: ${JWT_REFRESH_TOKEN_DURATION:7d}

    # Los valores deben ser rutas de recursos, por ejemplo:
    # file:C:/ruta/privada/private.pem
    # file:C:/ruta/privada/public.pem
    private-key: ${JWT_PRIVATE_KEY_LOCATION}
    public-key: ${JWT_PUBLIC_KEY_LOCATION}
