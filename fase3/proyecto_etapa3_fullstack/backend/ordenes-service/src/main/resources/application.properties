# Nombre y puerto del microservicio
spring.application.name=ordenes-service
server.port=8086

# ------------------------------------------------------------------
# LOGS
# ------------------------------------------------------------------

logging.level.org.springframework.web=INFO
logging.level.root=INFO
spring.output.ansi.enabled=ALWAYS

# ------------------------------------------------------------------
# CONEXIÓN CON POSTGRESQL
# ------------------------------------------------------------------

# Variables exclusivas de la base de datos de órdenes
# La URL JDBC debe incluir sslmode=require
spring.datasource.url=${ORDENES_DB_URL}
spring.datasource.username=${ORDENES_DB_USERNAME}
spring.datasource.password=${ORDENES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ------------------------------------------------------------------
# INICIALIZACIÓN SQL
# ------------------------------------------------------------------

# Flyway administrará la estructura y los datos iniciales
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ------------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------------

# Valida las tablas sin crearlas ni modificarlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=db_ordenes

# Configuración de consultas y fechas
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# MIGRACIONES CON FLYWAY
# ------------------------------------------------------------------

spring.flyway.enabled=true
spring.flyway.default-schema=db_ordenes
spring.flyway.schemas=db_ordenes
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# ------------------------------------------------------------------
# SWAGGER / OPENAPI
# ------------------------------------------------------------------

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html