# Configuración de órdenes de NutriVida. La sangría agrupa cada propiedad.
# Las credenciales reales se configurarán después mediante variables de entorno.

# El nombre del servicio y su puerto están en application.properties.

# Opciones que Spring Boot utiliza al iniciar la aplicación.
spring:
  # Formato de los mensajes que aparecen en la terminal.
  output:
    # Opciones para colores mediante códigos ANSI.
    ansi:
      # Solicita colores incluso si la detección automática no los activa.
      enabled: ALWAYS

  # Conexión a la base PostgreSQL exclusiva de órdenes.
  datasource:
    # Conexión Supabase con SSL; la variable permite usar otra base.
    url: ${ORDENES_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
    # Usuario del proyecto de órdenes; puede reemplazarse desde el entorno.
    username: ${ORDENES_DB_USERNAME:postgres.ngjummwpmhqdtabcieeg}
    # Contraseña desde el entorno; nunca escribir el secreto en este archivo.
    password: ${ORDENES_DB_PASSWORD}
    # Driver JDBC que permite comunicarse con PostgreSQL.
    driver-class-name: org.postgresql.Driver
    # Pool que reutiliza conexiones para no abrir una por cada operación.
    hikari:
      # Permite como máximo cinco conexiones simultáneas.
      maximum-pool-size: 5
      # Mantiene una conexión ociosa preparada cuando es posible.
      minimum-idle: 1

  # Opciones de inicialización mediante scripts SQL convencionales.
  sql:
    # Configura la ejecución automática de schema.sql y data.sql.
    init:
      # No ejecuta esos scripts: las tablas se administran con Flyway.
      mode: never

  # Persistencia: relaciona las entidades Java con sus tablas PostgreSQL.
  jpa:
    # No posterga la inicialización de datos hasta después de JPA.
    defer-datasource-initialization: false
    # Opciones del motor Hibernate utilizado por JPA.
    hibernate:
      # Solo valida las tablas; no crea, modifica ni elimina su estructura.
      ddl-auto: validate
    # Propiedades adicionales que se entregan directamente a Hibernate.
    properties:
      # Agrupa las opciones específicas de este motor de persistencia.
      hibernate:
        # Esquema donde están las tablas de órdenes dentro de su propia base.
        default_schema: db_ordenes
        # Da formato al SQL cuando se habilita su visualización.
        format_sql: true
        # Opciones del intercambio de datos mediante JDBC.
        jdbc:
          # Usa UTC para el intercambio de fechas con la base.
          time_zone: UTC
    # No imprime automáticamente todas las consultas SQL en consola.
    show-sql: false
    # Obliga a leer las relaciones LAZY dentro de la transacción del servicio.
    open-in-view: false

  # Administración versionada de la estructura de la base de datos.
  flyway:
    # Aplica las migraciones pendientes durante el arranque.
    enabled: true
    # Esquema donde se conserva el historial de migraciones.
    default-schema: db_ordenes
    # Esquema administrado por este servicio, separado de los demás.
    schemas: db_ordenes
    # Permite crear el esquema si no existe y el usuario tiene permisos.
    create-schemas: true
    # Carpeta de recursos donde se buscan las migraciones SQL versionadas.
    locations: classpath:db/migration
    # Impide utilizar clean para borrar los objetos del esquema.
    clean-disabled: true

  # Comunicación entre servicios mediante Spring Cloud OpenFeign, sin Eureka.
  cloud:
    # Configuración de los clientes HTTP declarados con @FeignClient.
    openfeign:
      # Opciones aplicables a los clientes generados por OpenFeign.
      client:
        # Configuraciones particulares identificadas por nombre de cliente.
        config:
          # Coincide con name="catalogo-service" de CatalogoClient.
          catalogo-service:
            # Espera como máximo 3000 milisegundos al establecer la conexión.
            connectTimeout: 3000
            # Espera como máximo 5000 milisegundos al leer la respuesta.
            readTimeout: 5000

# Nivel de detalle de los eventos que se muestran en consola.
logging:
  # Cada entrada establece el nivel para todo el proceso o para un paquete.
  level:
    # Muestra los eventos generales habituales con nivel INFO.
    root: INFO
    # Muestra información de la capa web sin activar depuración detallada.
    org.springframework.web: INFO

# Documentación de los endpoints del servicio de órdenes.
springdoc:
  # Documento OpenAPI JSON disponible por defecto en /v3/api-docs.
  api-docs:
    # Habilita la generación del documento de la API.
    enabled: true
  # Interfaz web para consultar y probar los endpoints.
  swagger-ui:
    # Habilita Swagger UI; los endpoints protegidos siguen exigiendo JWT.
    enabled: true
    # Dirección de entrada: http://localhost:8086/doc/swagger-ui.html.
    path: /doc/swagger-ui.html

# Propiedades propias de NutriVida que leen las clases mediante @Value.
app:
  # Dirección del servicio que entrega los planes y sus precios.
  catalogo:
    # Selecciona el adaptador; otro proyecto puede implementar CatalogoPort.
    proveedor: nutrivida
    # Ruta configurable de la API que proporciona el catálogo.
    ruta-planes: ${CATALOGO_PLANES_PATH:/api/v1/catalogo/planes}
    # Lee la variable o utiliza la URL local directa, sin descubrimiento.
    url: ${CATALOGO_SERVICE_URL:http://localhost:8083}
  # Verificación de tokens emitidos por autenticación.
  jwt:
    # Emisor que debe coincidir exactamente con el campo iss del JWT.
    issuer: ${JWT_ISSUER:http://localhost:8081}
    # Endpoint de claves públicas RSA; órdenes no necesita la clave privada.
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
