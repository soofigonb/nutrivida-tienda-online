# Configuración propia del catálogo de NutriVida.
spring:
  profiles:
    default: nutrivida
  flyway:
    # El perfil NutriVida agrega sus datos iniciales.
    locations: classpath:db/migration
  # Valida los tokens emitidos por Autenticación.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app:
  security:
    # Atributo de roles y permiso de escritura.
    roles-claim: ${JWT_ROLES_CLAIM:roles}
    write-role: ${CATALOGO_WRITE_ROLE:ADMINISTRADOR}
---
# Datos de ejemplo para NutriVida.
spring:
  config:
    activate:
      on-profile: nutrivida
  flyway:
    locations: classpath:db/migration,classpath:db/nutrivida
catalogo:
  precio-decimales: 0
