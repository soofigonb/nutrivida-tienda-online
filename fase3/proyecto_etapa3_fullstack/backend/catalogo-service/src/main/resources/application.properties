# Nombre que identifica este componente de NutriVida.
spring.application.name=catalogo-service

# Puerto local del servicio. Su URL base es http://localhost:8083.
server.port=${CATALOGO_PORT:8083}

# Registra la actividad HTTP.
logging.level.org.springframework.web=INFO

# Nivel general de mensajes.
logging.level.root=INFO

# Habilita colores en consola.
spring.output.ansi.enabled=ALWAYS

# URL JDBC de PostgreSQL.
spring.datasource.url=${CATALOGO_DB_URL:}

# Usuario de PostgreSQL.
spring.datasource.username=${CATALOGO_DB_USERNAME:}

# Contraseña de PostgreSQL.
spring.datasource.password=${CATALOGO_DB_PASSWORD:}

# Driver JDBC de PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway administra los scripts SQL.
spring.sql.init.mode=never

# Hibernate valida las tablas existentes.
spring.jpa.hibernate.ddl-auto=validate

# Esquema usado por JPA.
spring.jpa.properties.hibernate.default_schema=db_catalogo

# Limita el acceso a datos a la capa de persistencia.
spring.jpa.open-in-view=false

# Habilita las migraciones versionadas.
spring.flyway.enabled=true

# Esquema del historial de migraciones.
spring.flyway.default-schema=db_catalogo

# Esquemas administrados por Flyway.
spring.flyway.schemas=db_catalogo

# Protege el esquema contra Flyway clean.
spring.flyway.clean-disabled=true

# Permite adoptar un esquema existente.
spring.flyway.baseline-on-migrate=true

# Publica el contrato OpenAPI.
springdoc.api-docs.enabled=true

# Habilita Swagger y define su ruta.
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
