spring:
  profiles:
    default: nutrivida
  datasource:
    url: ${PROFESIONALES_DB_URL}
    username: ${PROFESIONALES_DB_USERNAME}
    password: ${PROFESIONALES_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: db_profesionales
  flyway:
    locations: classpath:db/migration
    default-schema: db_profesionales
    schemas: db_profesionales
    clean-disabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app:
  security:
    roles-claim: ${JWT_ROLES_CLAIM:roles}
    write-role: ${PROFESIONALES_WRITE_ROLE:ADMINISTRADOR}
springdoc:
  swagger-ui:
    path: /doc/swagger-ui.html
---
# Datos de ejemplo para NutriVida.
spring:
  config:
    activate:
      on-profile: nutrivida
  flyway:
    locations: classpath:db/migration,classpath:db/nutrivida
